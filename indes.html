<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辦公室點餐小幫手</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --success: #16a34a;
      --success-light: #dcfce7;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 40px; }
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }

    header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 14px 20px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    .title-group p { font-size: 0.85rem; color: var(--text-muted); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; background: var(--card-bg); color: var(--text); text-decoration: none; }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { border-color: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }

    .banner-locked { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; padding: 10px 14px; border-radius: var(--radius); font-size: 0.88rem; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-val { font-size: 1.25rem; font-weight: 700; }
    .stat-val.primary { color: var(--primary); }

    .layout-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .layout-grid { grid-template-columns: 1fr; }
    }

    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    /* 菜單網址與圖片 */
    .menu-link-section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
    .link-display { display: none; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; background: #eff6ff; padding: 8px 12px; border-radius: var(--radius); border: 1px solid #bfdbfe; }
    .link-display a { color: var(--primary); font-weight: 600; text-decoration: none; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-display a:hover { text-decoration: underline; }

    .menu-uploader { border: 2px dashed #cbd5e1; border-radius: var(--radius); padding: 18px; text-align: center; background: #f8fafc; cursor: pointer; margin-bottom: 14px; }
    .menu-uploader:hover { border-color: var(--primary); background: #f1f5f9; }
    .menu-img-container { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); margin-bottom: 14px; display: none; background: #000; }
    .menu-img-container img { width: 100%; max-height: 320px; object-fit: contain; cursor: zoom-in; display: block; }
    .menu-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; }
    .form-control:focus { outline: none; border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

    .order-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }
    .order-item .user { font-weight: 600; }
    .order-item .note { font-size: 0.8rem; color: var(--text-muted); }
    .order-item .price { font-weight: 700; margin-left: 8px; }

    .badge-paid { background: var(--success-light); color: var(--success); border: 1px solid #bbf7d0; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; }
    .badge-unpaid { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; cursor: pointer; }

    .summary-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-top: 14px; }
    .summary-item { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .summary-item:last-child { border-bottom: none; }

    /* 燈箱大圖 */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1 id="shopTitle" contenteditable="true" title="點擊可修改店家名稱">今日午餐團購 (點此可改名)</h1>
      <p id="todayDate"></p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" id="lockBtn" onclick="toggleLock()">🔒 鎖定結單</button>
      <button class="btn btn-outline" onclick="copySummaryText()">📋 複製叫餐清單</button>
      <button class="btn btn-outline" onclick="exportCSV()">📊 匯出 CSV</button>
      <button class="btn btn-danger btn-sm" onclick="clearAllOrders()">清空全部</button>
    </div>
  </header>

  <div id="lockBanner" class="banner-locked">
    <span>⚠️ 主揪已結單，目前停止接收新點單與修改。</span>
    <button class="btn btn-sm btn-outline" onclick="toggleLock()">解除鎖定</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">總點餐份數</div>
      <div class="stat-val" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">訂單總金額</div>
      <div class="stat-val primary" id="totalAmount">$0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">點餐人數</div>
      <div class="stat-val" id="totalUsers">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">未收款人數</div>
      <div class="stat-val" style="color: var(--danger);" id="unpaidUsers">0</div>
    </div>
  </div>

  <div class="layout-grid">
    <!-- 左側：菜單管理 (網址/圖片) 與點餐 -->
    <div>
      <div class="card">
        <div class="card-title">
          <span>📖 店家菜單</span>
          <button class="btn btn-sm btn-outline" id="removeImgBtn" style="display:none;" onclick="removeMenuImage()">移除圖片</button>
        </div>

        <!-- 菜單網址區塊 -->
        <div class="menu-link-section">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px;">🔗 線上菜單連結 (網址)</label>
          <div style="display: flex; gap: 6px;">
            <input type="url" id="menuUrlInput" class="form-control" placeholder="貼上菜單網址，如 https://...">
            <button class="btn btn-outline btn-sm" onclick="saveMenuUrl()" style="white-space: nowrap;">儲存連結</button>
          </div>
          
          <div id="menuLinkDisplay" class="link-display">
            <a id="externalMenuLink" href="#" target="_blank" rel="noopener noreferrer">🌐 點此前往店家線上菜單 ↗</a>
            <button class="btn btn-sm btn-outline" onclick="removeMenuUrl()" style="color: var(--danger);">移除</button>
          </div>
        </div>
        
        <!-- 圖片上傳區塊 -->
        <div id="uploadBox" class="menu-uploader" onclick="document.getElementById('menuInput').click()">
          <p>📷 點擊上傳菜單圖片</p>
          <span style="font-size: 0.75rem; color: var(--text-muted);">支援 JPG、PNG</span>
          <input type="file" id="menuInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        </div>

        <div id="previewBox" class="menu-img-container">
          <img id="menuImg" alt="菜單預覽" onclick="openLightbox()">
          <div class="menu-actions">
            <span>🔍 點擊圖片放大檢視</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📝 我要點餐</div>
        <form id="orderForm" onsubmit="addOrder(event)">
          <div class="form-group">
            <label>同事暱稱</label>
            <input type="text" id="userName" class="form-control" placeholder="請輸入姓名/暱稱" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>餐點品項</label>
              <input type="text" id="itemName" class="form-control" placeholder="例如：排骨便當" required>
            </div>
            <div class="form-group">
              <label>金額 ($)</label>
              <input type="number" id="price" class="form-control" placeholder="100" min="0" required>
            </div>
          </div>
          <div class="form-group">
            <label>備註需求</label>
            <input type="text" id="options" class="form-control" placeholder="例如：微辣、飯少、不加香菜">
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">+ 送出訂單</button>
        </form>
      </div>
    </div>

    <!-- 右側：訂單清單與統計 -->
    <div>
      <div class="card">
        <div class="card-title">
          <span>📋 即時點餐清單</span>
        </div>
        <ul id="orderList" class="order-list"></ul>
      </div>

      <div class="card">
        <div class="card-title">📞 主揪叫餐彙總 (打電話用)</div>
        <div id="summaryList" class="summary-box">
          <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">尚無訂單彙總</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg">
</div>

<script>
  let orders = JSON.parse(localStorage.getItem('office_orders') || '[]');
  let isLocked = JSON.parse(localStorage.getItem('office_locked') || 'false');
  let savedMenuImg = localStorage.getItem('office_menu_img') || '';
  let savedMenuUrl = localStorage.getItem('office_menu_url') || '';

  document.getElementById('todayDate').innerText = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });

  // 初始化
  window.onload = function() {
    const savedName = localStorage.getItem('office_username');
    if (savedName) document.getElementById('userName').value = savedName;

    if (savedMenuImg) {
      showMenuImage(savedMenuImg);
    }
    if (savedMenuUrl) {
      showMenuUrl(savedMenuUrl);
    }
    updateLockUI();
    renderOrders();
  };

  // 處理菜單網址
  function saveMenuUrl() {
    let url = document.getElementById('menuUrlInput').value.trim();
    if (!url) return;
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = 'https://' + url;
    }
    localStorage.setItem('office_menu_url', url);
    showMenuUrl(url);
    document.getElementById('menuUrlInput').value = '';
  }

  function showMenuUrl(url) {
    const linkEl = document.getElementById('externalMenuLink');
    linkEl.href = url;
    document.getElementById('menuLinkDisplay').style.display = 'flex';
  }

  function removeMenuUrl() {
    localStorage.removeItem('office_menu_url');
    document.getElementById('menuLinkDisplay').style.display = 'none';
  }

  // 處理菜單圖片上傳並壓縮
  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1200;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = (height * maxDim) / width;
            width = maxDim;
          } else {
            width = (width * maxDim) / height;
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedData = canvas.toDataURL('image/jpeg', 0.7);
        try {
          localStorage.setItem('office_menu_img', compressedData);
          showMenuImage(compressedData);
        } catch (err) {
          alert('圖片檔案較大，無法存入本地暫存，請更換較小的圖片！');
        }
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  function showMenuImage(url) {
    document.getElementById('menuImg').src = url;
    document.getElementById('previewBox').style.display = 'block';
    document.getElementById('uploadBox').style.display = 'none';
    document.getElementById('removeImgBtn').style.display = 'inline-flex';
  }

  function removeMenuImage() {
    localStorage.removeItem('office_menu_img');
    document.getElementById('previewBox').style.display = 'none';
    document.getElementById('uploadBox').style.display = 'block';
    document.getElementById('removeImgBtn').style.display = 'none';
    document.getElementById('menuInput').value = '';
  }

  function openLightbox() {
    const src = document.getElementById('menuImg').src;
    if (src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  // 點單操作
  function addOrder(e) {
    e.preventDefault();
    if (isLocked) {
      alert('已結單，目前無法新增品項！');
      return;
    }

    const userName = document.getElementById('userName').value.trim();
    const itemName = document.getElementById('itemName').value.trim();
    const price = parseInt(document.getElementById('price').value) || 0;
    const options = document.getElementById('options').value.trim();

    localStorage.setItem('office_username', userName);

    const newOrder = {
      id: Date.now().toString(),
      userName,
      itemName,
      price,
      options,
      paid: false
    };

    orders.push(newOrder);
    saveAndRender();

    document.getElementById('itemName').value = '';
    document.getElementById('price').value = '';
    document.getElementById('options').value = '';
  }

  function togglePaid(id) {
    orders = orders.map(o => o.id === id ? { ...o, paid: !o.paid } : o);
    saveAndRender();
  }

  function deleteOrder(id) {
    if (isLocked) {
      alert('已結單，目前無法刪除品項！');
      return;
    }
    orders = orders.filter(o => o.id !== id);
    saveAndRender();
  }

  function toggleLock() {
    isLocked = !isLocked;
    localStorage.setItem('office_locked', JSON.stringify(isLocked));
    updateLockUI();
  }

  function updateLockUI() {
    document.getElementById('lockBanner').style.display = isLocked ? 'flex' : 'none';
    document.getElementById('lockBtn').innerText = isLocked ? '🔓 解除結單' : '🔒 鎖定結單';
    document.getElementById('submitBtn').disabled = isLocked;
    document.getElementById('submitBtn').style.opacity = isLocked ? '0.5' : '1';
  }

  function clearAllOrders() {
    if (confirm('確定要清空所有點餐資料嗎？')) {
      orders = [];
      saveAndRender();
    }
  }

  function saveAndRender() {
    localStorage.setItem('office_orders', JSON.stringify(orders));
    renderOrders();
  }

  function renderOrders() {
    const listEl = document.getElementById('orderList');
    listEl.innerHTML = '';

    let totalAmount = 0;
    const usersSet = new Set();
    let unpaidCount = 0;
    const summaryMap = {};

    if (orders.length === 0) {
      listEl.innerHTML = '<li style="text-align:center; color: var(--text-muted); padding: 24px;">目前還沒有人點餐喔！</li>';
    } else {
      orders.forEach(order => {
        totalAmount += order.price;
        usersSet.add(order.userName);
        if (!order.paid) unpaidCount++;

        const key = order.options ? `${order.itemName} (${order.options})` : order.itemName;
        summaryMap[key] = (summaryMap[key] || 0) + 1;

        const li = document.createElement('li');
        li.className = 'order-item';
        li.innerHTML = `
          <div>
            <div><span class="user">${order.userName}</span>: ${order.itemName} <span class="price">$${order.price}</span></div>
            ${order.options ? `<div class="note">${order.options}</div>` : ''}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="${order.paid ? 'badge-paid' : 'badge-unpaid'}" onclick="togglePaid('${order.id}')" title="點擊切換付款狀態">
              ${order.paid ? '✓ 已付' : '✗ 未付'}
            </span>
            ${!isLocked ? `<button class="btn btn-sm btn-outline" onclick="deleteOrder('${order.id}')" style="color:var(--danger);">✕</button>` : ''}
          </div>
        `;
        listEl.appendChild(li);
      });
    }

    document.getElementById('totalCount').innerText = orders.length;
    document.getElementById('totalAmount').innerText = `$${totalAmount}`;
    document.getElementById('totalUsers').innerText = usersSet.size;
    document.getElementById('unpaidUsers').innerText = unpaidCount;

    const summaryEl = document.getElementById('summaryList');
    if (orders.length === 0) {
      summaryEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">尚無訂單彙總</div>';
    } else {
      summaryEl.innerHTML = '';
      for (const [item, count] of Object.entries(summaryMap)) {
        const div = document.createElement('div');
        div.className = 'summary-item';
        div.innerHTML = `<span>${item}</span><strong>× ${count}</strong>`;
        summaryEl.appendChild(div);
      }
    }
  }

  function copySummaryText() {
    if (orders.length === 0) {
      alert('目前沒有點單資料可複製！');
      return;
    }
    const title = document.getElementById('shopTitle').innerText.trim();
    let text = `🍱【${title}】點餐統計\n------------------\n`;
    
    const summaryMap = {};
    orders.forEach(o => {
      const key = o.options ? `${o.itemName} (${o.options})` : o.itemName;
      summaryMap[key] = (summaryMap[key] || 0) + 1;
    });

    for (const [name, count] of Object.entries(summaryMap)) {
      text += `• ${name} × ${count}\n`;
    }

    const total = orders.reduce((sum, o) => sum + o.price, 0);
    text += `------------------\n總份數：${orders.length} 份 / 總金額：$${total}`;

    navigator.clipboard.writeText(text).then(() => alert('叫餐清單已成功複製到剪貼簿！'));
  }

  function exportCSV() {
    if (orders.length === 0) {
      alert('目前無資料可匯出！');
      return;
    }
    let csv = '\uFEFF姓名,餐點品項,金額,客製備註,付款狀態\n';
    orders.forEach(o => {
      csv += `"${o.userName}","${o.itemName}",${o.price},"${o.options || ''}","${o.paid ? '已付' : '未付'}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `點餐明細_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
